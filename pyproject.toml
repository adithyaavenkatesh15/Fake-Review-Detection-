[project]
name = "fake-review-detector"
version = "0.2.0"
description = "Machine learning project that detects fake vs real product reviews."
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "plotly>=5.20.0",
    "seaborn>=0.13.0",
    "joblib>=1.3.0",
    "streamlit>=1.33.0",
    "textblob>=0.17.1",
    "nltk>=3.8.1",
    "pydantic>=2.4.0",
    "sentence-transformers>=2.0.0",
    "optuna>=3.0.0",
    "mlflow>=2.0.0",
    "shap>=0.40.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "datasets>=2.14.0",
    "evidently>=0.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3.0",
    "pre-commit>=3.0",
    "dvc>=3.0"
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E402"]
